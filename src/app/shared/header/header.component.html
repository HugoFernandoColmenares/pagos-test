<header class="w-full flex items-center justify-between p-4 border-b custom-border-bottom"
        style="background: var(--color-surface); border-color: var(--color-border); font-family: var(--font-sans);">

  <!-- Logo / Título -->
  <div class="flex items-center gap-3">
    <svg class="h-8 w-8" fill="none" stroke="var(--color-primary)" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18M5 6h14M5 18h14"/>
    </svg>
    <span class="text-lg font-semibold" style="color: var(--color-text);">
      Payment Manager
    </span>
  </div>

  <!-- Perfil / Usuario -->
  <div class="flex items-center gap-3">
    @if (currentUser !== null) {
      <p-badge [value]="'Rol: ' + (currentUser.role | roleBadge).label" [severity]="returnSeverity((currentUser.role | roleBadge).severity)" />
    }
    <div id="logout" class="btn danger-bg" (click)="onCloseSesson()">
      Salir
    </div>
  </div>
</header>
